<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- အဝါရောင် နောက်ခံ စက်ဝိုင်း -->
  <circle cx="50" cy="50" r="50" fill="#EBA818"/>

  <!-- စကားပြော သင်္ကေတ (စက်ဝိုင်းအပိုင်းကို Center 50,50 ၌ အတိအကျ ညှိထားသည်) -->
  <path d="M 16 50 
           A 34 34 0 1 1 84 50 
           A 34 34 0 0 1 58 82 
           L 50 91 
           L 42 82 
           A 34 34 0 0 1 16 50 Z" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10"/>

  <!-- အမှန်ခြစ် (စက်ဝိုင်း Center နှင့်အညီ ရွှေ့ထားသည်) -->
  <path d="M 35 49 L 45 59 L 65 39" 
        fill="none" 
        stroke="#EBA818" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
