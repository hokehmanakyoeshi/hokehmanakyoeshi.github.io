<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background Yellow Circle -->
  <circle cx="300" cy="300" r="300" fill="#FBC013" />
  
  <!-- Symbol: Curved Equal Bars -->
  <g fill="none" stroke="#000000" stroke-width="60" stroke-linecap="round">
    <!-- Top Curved Bar -->
    <path d="M 180 230 Q 300 280 420 230" />
    
    <!-- Bottom Curved Bar -->
