<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဟုတ်မှန်အကျိုးရှိ - ရှာဖွေရေးနှင့် အချက်အလက်များ</title>
    <link rel="stylesheet" href="darkmode.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixed Top Header / Navigation Bar -->
    <header class="site-header">
        <div class="nav-container">
            <!-- Brand Logo & Name -->
            <a href="#" class="brand-container">
                <div class="logo-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
                      <circle cx="50" cy="50" r="50" fill="#C49102"/>
                      <path d="M 16 50 A 34 34 0 1 1 84 50 A 34 34 0 0 1 58 82 L 50 91 L 42 82 A 34 34 0 0 1 16 50 Z" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10"/>
                      <path d="M 33 50 L 44 61 L 67 38" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="brand-title">ဟုတ်မှန်အကျိုးရှိ</h1>
            </a>

            <!-- Mode Toggle Button -->
            <button type="button" id="modeToggleBtn" class="mode-toggle-btn" title="မုဒ်ပြောင်းရန်"></button>
        </div>

        <!-- Search Bar Section -->
        <div class="search-box-wrapper">
            <div class="search-input-container">
                <span class="icon-svg search-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="searchInput" placeholder="Username ဖြင့် ရှာရန် (ဥပမာ - aungaung, bohtoo)" autocomplete="off">
                <button type="button" id="clearBtn" class="clear-btn" style="display: none;" title="ဖျက်ရန်">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <!-- Autocomplete Dropdown Container -->
            <div id="autocompleteDropdown" class="autocomplete-dropdown" style="display: none;"></div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <span>ဒေတာများကို ရှာဖွေနေပါသည်...</span>
        </div>

        <!-- Selected Profile View Container -->
        <div id="selectedProfileContainer" class="profile-container" style="display: none;"></div>

        <section class="feed-section">
            <h2 class="feed-title">ရှာဖွေရေး စနစ် (Lazy Search System)</h2>
            <p style="font-size: 0.85rem; color: var(--subtext-color);">အထက်ပါ ရှာဖွေရေးဘောက်စ်တွင် Username (သို့) အမည်ကို ရိုက်ထည့်၍ ရှာဖွေနိုင်ပါသည်။</p>
        </section>
    </main>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>ပင်မ</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>ရှာဖွေရန်</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>အသိုင်းအဝိုင်း</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>အကြောင်း</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="darkmode.js"></script>
    <script src="main-index.js"></script>
    <script src="main-app.js"></script>
</body>
</html>
