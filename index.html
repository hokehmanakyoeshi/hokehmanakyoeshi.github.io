<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">

    <title>မြန်မာစာအုပ်များ - ကဏ္ဍများ</title>
    <link rel="stylesheet" href="darkmode-book.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixed Top Header / Navigation Bar -->
    <header class="site-header" role="banner">
        <div class="nav-container">
            <a href="index.html" class="brand-container" aria-label="ပင်မစာမျက်နှာသို့ သွားရန်">
                <div class="logo-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" aria-hidden="true">
                      <!-- တည်ငြိမ်သော ရွှေဝါရောင် နောက်ခံ စက်ဝိုင်း (#C49102) -->
                      <circle cx="50" cy="50" r="50" fill="#C49102"/>
                      <!-- စကားပြော သင်္ကေတ (MASTER WEIGHT - 5.5) -->
                      <path d="M 16 50 
                               A 34 34 0 1 1 84 50 
                               A 34 34 0 0 1 58 82 
                               L 50 91 
                               L 42 82 
                               A 34 34 0 0 1 16 50 Z" 
                            fill="none" 
                            stroke="#000000" 
                            stroke-width="5.5" 
                            stroke-linecap="round" 
                            stroke-linejoin="miter" 
                            stroke-miterlimit="10"/>
                      <!-- အမှန်ခြစ် သင်္ကေတ -->
                      <path d="M 33 50 L 44 61 L 67 38" 
                            fill="none" 
                            stroke="#000000" 
                            stroke-width="5.5" 
                            stroke-linecap="round" 
                            stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="brand-title">ဟုတ်မှန်အကျိုးရှိ</h1>
            </a>
            <button type="button" id="modeToggleBtn" class="mode-toggle-btn" aria-label="အမှောင်/အလင်း မုဒ်ပြောင်းရန်" title="မုဒ်ပြောင်းရန်">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content" role="main">
        <section class="categories-section" aria-label="စာအုပ်ကဏ္ဍများ">
            
            <!-- ဘာသာရေး ကဏ္ဍ -->
            <article class="category-card">
                <div class="category-header">
                    <div class="category-icon-wrapper" aria-hidden="true">
                        <!-- လှည်းဘီး အပြည့်အဝ ပေါ်စေရန် viewBox နှင့် scale ကို အချိုးကျ ချိန်ညှိထားသော ဘာသာရေး လှည်းဘီး SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 96 96" width="22" height="22" fill="currentColor" stroke="currentColor">
                          <!-- အပြင်ဘက် စက်ဝိုင်းကွင်း (Rim) -->
                          <circle cx="50" cy="50" r="36" fill="none" stroke-width="5.5" />
                          
                          <!-- မဂ္ဂင် ၈ ပါး ဝင်ရိုးချောင်းများ -->
                          <g fill="none" stroke-width="4.5" stroke-linecap="round">
                            <path d="M 50,50 L 50,14" />
                            <path d="M 50,50 L 86,50" />
                            <path d="M 50,50 L 50,86" />
                            <path d="M 50,50 L 14,50" />
                            <path d="M 50,50 L 75.4,24.6" />
                            <path d="M 50,50 L 75.4,75.4" />
                            <path d="M 50,50 L 24.6,75.4" />
                            <path d="M 50,50 L 24.6,24.6" />
                          </g>

                          <!-- အလယ် ဗဟို ဝင်ရိုး (Hub) -->
                          <circle cx="50" cy="50" r="7" stroke="none" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="category-title">ဘာသာရေး</h2>
                        <p class="category-desc">တရားဓမ္မ၊ ကိုးကွယ်ယုံကြည်မှုနှင့် သာသနာရေးဆိုင်ရာ စာပေများ</p>
                    </div>
                </div>
                <div class="category-links">
                    <a href="religion-book.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                        <span>စာအုပ်</span>
                    </a>
                    <a href="religion-name.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>နာမည်</span>
                    </a>
                    <a href="religion-hobby.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span>ဝါသနာ</span>
                    </a>
                </div>
            </article>

            <!-- လူမှုရေး ကဏ္ဍ -->
            <article class="category-card">
                <div class="category-header">
                    <div class="category-icon-wrapper" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div>
                        <h2 class="category-title">လူမှုရေး</h2>
                        <p class="category-desc">လူမှုဆက်ဆံရေး၊ ယဉ်ကျေးမှုနှင့် သုတေသနဆောင်းပါးများ</p>
                    </div>
                </div>
                <div class="category-links">
                    <a href="social-book.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                        <span>စာအုပ်</span>
                    </a>
                    <a href="social-name.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>နာမည်</span>
                    </a>
                    <a href="social-hobby.html" class="category-link-item">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span>ဝါသနာ</span>
                    </a>

            </article>

        </section>
