<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အသုံးပြုသူများ - ပရိုဖိုင်ရှာဖွေရေးနှင့် အကြံပြုချက်များ</title>
    <link rel="stylesheet" href="darkmode-book.css">
    <link rel="stylesheet" href="book-style.css">
    <link rel="stylesheet" href="newfeed-book-style.css">
</head>
<body>
    <!-- Fixed Top Header / Navigation Bar -->
    <header class="site-header">
        <div class="nav-container">
            <a href="profile.html" class="brand-container">
                <div class="logo-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36">
                      <circle cx="50" cy="50" r="50" fill="#C49102"/>
                      <path d="M 16 50 A 34 34 0 1 1 84 50 A 34 34 0 1 1 16 50 Z" fill="none" stroke="#000000" stroke-width="5.5"/>
                      <circle cx="50" cy="38" r="12" fill="#000000"/>
                      <path d="M 26 76 C 26 62 36 56 50 56 C 64 56 74 62 74 76" fill="#000000"/>
                    </svg>
                </div>
                <h1 class="brand-title">အသိုင်းအဝိုင်း ပရိုဖိုင်များ</h1>
            </a>
            <button type="button" id="modeToggleBtn" class="mode-toggle-btn" title="မုဒ်ပြောင်းရန်">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
        <!-- Profile Search Bar Section -->
        <div class="search-box-wrapper">
            <div class="search-input-container">
                <span class="icon-svg search-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="searchInput" placeholder="အမည် သို့မဟုတ် username ဖြင့် ရှာရန်..." autocomplete="off">
                <button type="button" id="clearBtn" class="clear-btn" style="display: none;" title="ဖျက်ရန်">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <!-- Autocomplete Dropdown Container -->
            <div id="autocompleteDropdown" class="autocomplete-dropdown" style="display: none;"></div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <span>ပရိုဖိုင်များကို ရှာဖွေနေပါသည်...</span>
        </div>
        <!-- Selected Profile View Container -->
        <div id="selectedBookContainer" class="profile-container" style="display: none;"></div>
        
        <!-- Recommended Profiles Feed Section -->
        <section class="newfeed-section">
            <div class="newfeed-header-wrap">
                <div class="feed-title-group">
                    <span class="feed-badge">Active</span>
                    <h2 class="feed-title">အကြံပြုအသုံးပြုသူများ</h2>
                </div>
                <button type="button" id="refreshFeedBtn" class="refresh-feed-btn" title="အသစ်ပြောင်းရန်">
                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>လဲလှယ်ရန်</span>
                </button>
            </div>
            
            <!-- Feed Loading Indicator -->
            <div id="newFeedLoading" class="loading-indicator">
                <div class="spinner"></div>
                <span>အသုံးပြုသူအသစ်များကို ရယူနေပါသည်...</span>
            </div>
            <!-- Profile Feed Container -->
            <div id="newFeedContainer" style="display: none;"></div>
        </section>
    </main>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>ပင်မ</span>
        </a>
        <a href="book.html" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>ရှာဖွေရန်</span>
        </a>
        <a href="profile.html" class="bottom-nav-item active">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>အသိုင်းအဝိုင်း</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>အကြောင်း</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="darkmode-book.js"></script>
    <script src="main-book-index.js"></script> <!-- Core Index / Helpers ပုံစံတူသုံးရန် -->
    <script src="main-profile-app.js"></script>
    <script src="newfeed-profile.js"></script>
</body>
</html>
